# Un solo comando para levantar todo el stack de desarrollo: `docker compose up`.
# Los .env reales de cada proyecto (backend/.env, ai-service/.env) se siguen usando tal cual vía
# env_file -- acá solo se pisan las claves de red (REDIS_URL, *_EMULATOR_HOST, etc.) porque dentro de
# esta red los servicios se resuelven por nombre, no por localhost.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: ./docker/firebase-emulator
    restart: unless-stopped
    working_dir: /app
    # Los emuladores viven solo en memoria por defecto -- cualquier reinicio del contenedor borra
    # cuentas y datos de Firestore. --import/--export-on-exit los persiste en un volumen con nombre,
    # así sobreviven a `docker compose restart`/`down`+`up` (export-on-exit solo corre con un apagado
    # prolijo -- SIGTERM/SIGINT -- no con un kill -9; `docker compose stop`/`restart` sí mandan SIGTERM).
    # stop_grace_period: el export tarda más que los 10s por defecto de Docker -- sin esto, Docker manda
    # SIGKILL a mitad de la exportación (visto en vivo: contenedor con exit code 137, metadata de
    # export corrupta/incompleta, y la cuenta registrada se pierde igual que sin --export-on-exit).
    stop_grace_period: 45s
    command:
      [
        "firebase",
        "emulators:start",
        "--only",
        "firestore,auth",
        "--import=/data/export",
        "--export-on-exit=/data/export",
      ]
    volumes:
      - ./firebase.json:/app/firebase.json
      - ./.firebaserc:/app/.firebaserc
      - ./firestore.rules:/app/firestore.rules
      - ./firestore.indexes.json:/app/firestore.indexes.json
      - firebase_emulator_data:/data
    ports:
      - "4000:4000"
      - "4400:4400"
      - "4500:4500"
      - "8080:8080"
      - "9099:9099"
      - "9150:9150"

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/models:/app/models

  backend-api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      RAVEN_URL: http://ai-service:8000
    depends_on:
      redis:
        condition: service_healthy
      firebase-emulator:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  backend-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["npm", "run", "worker:dev"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      RAVEN_URL: http://ai-service:8000
    depends_on:
      redis:
        condition: service_healthy
      firebase-emulator:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      API_URL: http://backend-api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side (firebase-admin, usado en /api/firebase-session) corre DENTRO del contenedor del
      # frontend y necesita el nombre del servicio. El NEXT_PUBLIC_ equivalente se deja tal cual viene
      # de .env.local (127.0.0.1:9099) porque ese lo lee el navegador en la máquina Windows del usuario.
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
    depends_on:
      - backend-api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  redis_data:
  firebase_emulator_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
