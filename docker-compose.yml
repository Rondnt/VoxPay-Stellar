# La base de datos es Firestore (no Postgres): el emulador local corre aparte con
# `firebase emulators:start --only firestore` (ver firebase.json), no via Docker.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  raven:
    build:
      context: ./ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models

volumes:
  redis_data:
