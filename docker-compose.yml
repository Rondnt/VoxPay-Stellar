services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxpay
      POSTGRES_PASSWORD: voxpay
      POSTGRES_DB: voxpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  raven:
    build:
      context: ./ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models

volumes:
  postgres_data:
  redis_data:
