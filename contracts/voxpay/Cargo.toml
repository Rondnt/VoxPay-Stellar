[package]
name = "voxpay"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `cdylib` no hace falta acá: `stellar contract build` lo pasa explícito vía `cargo rustc
# --crate-type=cdylib --target=wasm32v1-none`. Declararlo también acá hace que `cargo test` intente
# linkear un cdylib (.dll) para el host en Windows-GNU, y el árbol de deps de soroban-env-host
# (curve25519-dalek, ark-bn254, k256, p256, ...) excede el límite de ordinales de export de una DLL PE.
crate-type = ["rlib"]

# Nota Windows: si `cargo test` falla al linkear con "cannot find -lgcc_eh" o símbolos
# `mingw_app_type`/`mingw_init*` sin resolver, es un GCC de sistema (p.ej. TDM-GCC) mezclado con los
# objetos de rustup -- correr con `RUSTFLAGS="-C link-self-contained=yes"` para que rustc use su propio
# toolchain GNU autocontenido (crt + libgcc_eh + ld) en vez del de sistema.

[dependencies]
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
